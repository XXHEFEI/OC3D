<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>转台预览 Demo（帧序列版）</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'PingFang SC', sans-serif;
            background: #08080c;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
        h1 { font-size: 20px; letter-spacing: 1px; opacity: 0.9; }
        .hint { color: #888; font-size: 14px; }
        .hint span { color: #00F0FF; }

        .stage {
            position: relative;
            width: 420px;
            height: 420px;
            border-radius: 24px;
            background: radial-gradient(circle at center, #2a2a34 0%, #08080c 72%);
            box-shadow: 0 0 40px rgba(0,240,255,0.08);
            overflow: hidden;
            cursor: grab;
            user-select: none;
        }
        .stage.dragging { cursor: grabbing; }
        .stage img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
            display: block;
        }
        .badge {
            position: absolute;
            top: 14px;
            right: 18px;
            font-size: 12px;
            color: #00F0FF;
            background: rgba(0,240,255,0.08);
            border: 1px solid rgba(0,240,255,0.3);
            padding: 4px 10px;
            border-radius: 20px;
            opacity: 0.8;
        }

        .color-switch {
            display: flex;
            gap: 12px;
            background: rgba(255,255,255,0.03);
            padding: 8px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .color-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: none;
            color: #888;
            font-size: 14px;
            padding: 8px 20px;
            border-radius: 24px;
            cursor: pointer;
            transition: 0.2s;
        }
        .color-btn .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .color-btn[data-color="黑"] .dot { background: #1a1a1a; }
        .color-btn[data-color="白"] .dot { background: #eee; }
        .color-btn.active {
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            color: #fff;
        }
        .color-btn:hover:not(.active) { color: #fff; }
    </style>
</head>
<body>

    <h1>弹簧小猫 · 转台预览测试</h1>
    <div class="stage" id="stage">
        <span class="badge" id="mode-badge">自动旋转</span>
        <img id="frame-img" src="" alt="turntable frame">
    </div>
    <div class="color-switch">
        <button class="color-btn active" data-color="黑" onclick="switchColor('黑', this)"><span class="dot"></span>黑色</button>
        <button class="color-btn" data-color="白" onclick="switchColor('白', this)"><span class="dot"></span>白色</button>
    </div>
    <div class="hint">鼠标 / 手指 <span>左右拖动</span> 可手动转动，松手后恢复自动旋转</div>

    <script>
        const FRAME_COUNT = 36; // 0~35 用于播放，第 36 帧与第 0 帧角度重合，仅用于闭环，不参与播放
        const MODEL_NAME = '弹簧小猫';
        const AUTOPLAY_MS = 60;
        const DRAG_PX_PER_FRAME = 6;
        const RESUME_DELAY_MS = 1200;

        const stage = document.getElementById('stage');
        const img = document.getElementById('frame-img');
        const badge = document.getElementById('mode-badge');

        let currentColor = '黑';
        const preloadedByColor = {};

        function frameSrc(i, color) {
            const idx = ((i % FRAME_COUNT) + FRAME_COUNT) % FRAME_COUNT;
            return `static/turntable/${MODEL_NAME}/${color || currentColor}/${idx}.png`;
        }

        // 预加载两套颜色的全部帧，切换颜色时不用等待
        function preloadColor(color) {
            if (preloadedByColor[color]) return;
            const arr = [];
            for (let i = 0; i < FRAME_COUNT; i++) {
                const im = new Image();
                im.src = frameSrc(i, color);
                arr.push(im);
            }
            preloadedByColor[color] = arr;
        }
        preloadColor('黑');
        preloadColor('白');

        function switchColor(color, btn) {
            currentColor = color;
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render();
        }

        let currentFrame = 0;
        let autoplayTimer = null;
        let resumeTimer = null;

        function render() {
            img.src = frameSrc(currentFrame);
        }

        function startAutoplay() {
            badge.textContent = '自动旋转';
            if (autoplayTimer) return;
            autoplayTimer = setInterval(() => {
                currentFrame += 1;
                render();
            }, AUTOPLAY_MS);
        }

        function stopAutoplay() {
            if (autoplayTimer) {
                clearInterval(autoplayTimer);
                autoplayTimer = null;
            }
        }

        function scheduleResume() {
            clearTimeout(resumeTimer);
            resumeTimer = setTimeout(startAutoplay, RESUME_DELAY_MS);
        }

        // 拖动手势：横向位移映射为帧序号
        let dragging = false;
        let dragStartX = 0;
        let dragStartFrame = 0;

        function onDragStart(clientX) {
            dragging = true;
            dragStartX = clientX;
            dragStartFrame = currentFrame;
            stopAutoplay();
            clearTimeout(resumeTimer);
            badge.textContent = '手动拖动';
            stage.classList.add('dragging');
        }

        function onDragMove(clientX) {
            if (!dragging) return;
            const deltaX = clientX - dragStartX;
            const deltaFrames = Math.round(-deltaX / DRAG_PX_PER_FRAME);
            currentFrame = dragStartFrame + deltaFrames;
            render();
        }

        function onDragEnd() {
            if (!dragging) return;
            dragging = false;
            stage.classList.remove('dragging');
            scheduleResume();
        }

        stage.addEventListener('mousedown', (e) => onDragStart(e.clientX));
        window.addEventListener('mousemove', (e) => onDragMove(e.clientX));
        window.addEventListener('mouseup', onDragEnd);

        stage.addEventListener('touchstart', (e) => onDragStart(e.touches[0].clientX), { passive: true });
        window.addEventListener('touchmove', (e) => onDragMove(e.touches[0].clientX), { passive: true });
        window.addEventListener('touchend', onDragEnd);

        render();
        startAutoplay();
    </script>
</body>
</html>
