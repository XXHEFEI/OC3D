<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaX 空间站</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #050508;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        /* ==== 顶栏 ==== */
        .top-bar {
            position: absolute; top: 50px; width: 100%;
            display: flex; justify-content: space-between; padding: 0 80px;
            z-index: 100; pointer-events: none; align-items: center;
        }
        
        .station-title {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 40px; 
            font-weight: 900; 
            letter-spacing: 4px;
            background: linear-gradient(135deg, #00F0FF 0%, #0072FF 50%, #B562FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.4));
        }
        
        .logo { height: 45px; opacity: 0.9; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }

        /* ==== 双路分屏布局 ==== */
        .split-container {
            width: 100vw; height: 100vh;
            display: flex; position: relative;
        }

        .panel {
            flex: 1; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            transition: all 0.6s cubic-bezier(0.25, 1, 0.25, 1);
            position: relative; overflow: hidden;
            cursor: pointer;
        }

        .panel-left {
            background: radial-gradient(circle at 30% 50%, #0f172a 0%, #050508 100%);
            border-right: 1px solid rgba(0, 217, 255, 0.1);
        }
        .panel-left:hover { background: radial-gradient(circle at 30% 50%, #163054 0%, #050508 100%); }

        .panel-right {
            background: radial-gradient(circle at 70% 50%, #1a0f1c 0%, #050508 100%);
            border-left: 1px solid rgba(255, 65, 108, 0.1);
        }
        .panel-right:hover { background: radial-gradient(circle at 70% 50%, #351624 0%, #050508 100%); }

        /* ==== 面板内容 ==== */
        .panel-content {
            text-align: center; z-index: 10;
            width: 65%; max-width: 500px; 
            transition: transform 0.4s;
        }
        
        .panel-left .panel-content { transform: translate(-12%, -20px); }
        .panel-left:hover .panel-content { transform: translate(-12%, -40px); }
        
        .panel-right .panel-content { transform: translate(12%, -20px); }
        .panel-right:hover .panel-content { transform: translate(12%, -40px); }

        .panel-title { font-size: 60px; font-weight: bold; margin-bottom: 25px; letter-spacing: 4px; }
        .panel-left .panel-title { color: #00d9ff; text-shadow: 0 0 40px rgba(0, 217, 255, 0.5); }
        .panel-right .panel-title { color: #ff416c; text-shadow: 0 0 40px rgba(255, 65, 108, 0.5); }

        .panel-desc { 
            font-size: 24px; color: #bbb; margin-bottom: 45px; 
            line-height: 1.8; letter-spacing: 2px; text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            text-align: center; 
        }
        
        .tag-wrap { display: flex; gap: 15px; justify-content: center; margin-bottom: 60px; flex-wrap: wrap;}
        .tag { 
            padding: 10px 20px; border-radius: 30px; font-size: 18px; font-weight: 500;
            background: rgba(255,255,255,0.03); backdrop-filter: blur(5px); letter-spacing: 1px;
        }

        /* ================= 预览图动态特效优化 ================= */
        .preview-images { 
            display: flex; align-items: center; justify-content: center; 
            opacity: 0.85; transition: 0.4s; 
        }
        .panel:hover .preview-images { opacity: 1; }

        /* 1. 左侧实拍图：高级相片层叠排版 */
        .panel-left .preview-images { gap: -40px; perspective: 1000px; }
        .panel-left .preview-images img { 
            width: 140px; height: 140px; object-fit: cover; 
            border-radius: 16px; 
            border: 2px solid rgba(255, 255, 255, 0.15); /* 增加微光边框分离照片 */
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.25, 1);
        }
        /* 左边第一张：稍微向左倾斜变暗 */
        .panel-left .preview-images img:nth-child(1) { z-index: 1; transform: scale(0.85) rotate(-6deg); filter: brightness(0.6); }
        /* 中间第二张：高亮放大并在最上层 */
        .panel-left .preview-images img:nth-child(2) { z-index: 3; transform: scale(1.15); border-color: rgba(0, 217, 255, 0.5); box-shadow: 0 15px 35px rgba(0, 217, 255, 0.2); }
        /* 右边第三张：稍微向右倾斜变暗 */
        .panel-left .preview-images img:nth-child(3) { z-index: 1; transform: scale(0.85) rotate(6deg); filter: brightness(0.6); }
        
        /* 左侧悬停互动：照片像扇子一样展开 */
        .panel-left:hover .preview-images img:nth-child(1) { transform: scale(0.9) rotate(-12deg) translateX(-15px); filter: brightness(0.9); }
        .panel-left:hover .preview-images img:nth-child(2) { transform: scale(1.25); }
        .panel-left:hover .preview-images img:nth-child(3) { transform: scale(0.9) rotate(12deg) translateX(15px); filter: brightness(0.9); }


        /* 2. 右侧透明图：保持原始透明并排缩放特效 */
        .panel-right .preview-images { gap: -20px; }
        .panel-right .preview-images img {
            width: 160px; height: 160px; object-fit: contain; 
            filter: drop-shadow(0 0 20px rgba(0,0,0,0.5));
            transition: all 0.4s;
        }
        .panel-right .preview-images img:nth-child(2) { transform: scale(1.2); z-index: 2; margin: 0 -20px; }
        .panel-right:hover .preview-images { transform: scale(1.1); }
        /* ======================================================== */


        .action-btn {
            padding: 22px 60px; border-radius: 50px; font-size: 26px; font-weight: bold;
            border: none; color: white; cursor: pointer; transition: all 0.3s;
            opacity: 0.7; letter-spacing: 2px;
        }
        .panel-left .action-btn { background: linear-gradient(90deg, #00c6ff, #0072ff); box-shadow: 0 0 30px rgba(0, 198, 255, 0.2); }
        .panel-right .action-btn { background: linear-gradient(90deg, #ff416c, #ff4b2b); box-shadow: 0 0 30px rgba(255, 65, 108, 0.2); }
        .panel:hover .action-btn { opacity: 1; transform: scale(1.08); box-shadow: 0 10px 40px rgba(0,0,0,0.5); }

        /* ==== 中央枢纽 ==== */
        .center-hub {
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            width: 550px; height: 550px; z-index: 50; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            pointer-events: none; 
        }
        
        .hub-bg {
            position: absolute; width: 100%; height: 100%;
            background: #08080c; border-radius: 50%;
            border: 3px solid #222; box-shadow: 0 0 80px rgba(0,0,0,0.8);
            transition: all 0.5s;
        }

        .guide-cat { 
            width: 300px; 
            height: auto;
            object-fit: contain;
            z-index: 10; 
            transition: all 0.3s; 
            margin-top: 80px; 
            filter: drop-shadow(0 0 25px rgba(255,255,255,0.08));
        }
        
        .guide-bubble {
            position: absolute; top: -20px; width: 450px; 
            background: rgba(15, 15, 25, 0.95); backdrop-filter: blur(15px);
            border: 2px solid #555; padding: 25px 35px; border-radius: 20px;
            color: #eee; font-size: 22px; text-align: center; line-height: 1.6;
            transition: all 0.4s; opacity: 1; letter-spacing: 1px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        }
        .guide-bubble::after {
            content: ''; position: absolute; bottom: -14px; left: 50%; transform: translateX(-50%);
            border-top: 14px solid #555; border-left: 14px solid transparent; border-right: 14px solid transparent;
            transition: border-color 0.4s;
        }

        /* Hover 联动变色 */
        .split-container:has(.panel-left:hover) .hub-bg { border-color: #00d9ff; box-shadow: 0 0 80px rgba(0,217,255,0.3); }
        .split-container:has(.panel-left:hover) .guide-bubble { border-color: #00d9ff; color: #fff; text-shadow: 0 0 10px rgba(0,217,255,0.4); }
        .split-container:has(.panel-left:hover) .guide-bubble::after { border-top-color: #00d9ff; }
        
        .split-container:has(.panel-right:hover) .hub-bg { border-color: #ff416c; box-shadow: 0 0 80px rgba(255,65,108,0.3); }
        .split-container:has(.panel-right:hover) .guide-bubble { border-color: #ff416c; color: #fff; text-shadow: 0 0 10px rgba(255,65,108,0.4); }
        .split-container:has(.panel-right:hover) .guide-bubble::after { border-top-color: #ff416c; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="station-title">“龙虾套餐”: 体验多智能体协作</div>
        <img src="static/images/meta_logo.png" alt="Logo" class="logo">
    </div>

    <div class="split-container" id="container">
        
        <!-- 左侧：速印工坊 -->
        <div class="panel panel-left" onmouseenter="updateCat('left')" onclick="location.href='select_classic.html'">
            <div class="panel-content">
                <div class="panel-title">速印工坊</div>
                <div class="panel-desc">展柜里都是目前呼声最高的经典款！每一只都超上镜，选一个最合眼缘的当场带走！</div>
                <div class="tag-wrap">
                    <span class="tag" style="color:#00d9ff; border: 1px solid #00d9ff;">现场出舱</span>
                    <span class="tag">三视图沉浸预览</span>
                    <span class="tag">实物即刻拥有</span>
                </div>
                
                <!-- 根据截图优化顺序，去除了死板的行内样式，交由全新 CSS 渲染层叠动画 -->
                <div class="preview-images">
                    <img src="static/images/cat_spring.png" alt="弹簧猫猫">
                    <img src="static/images/cat_lay.jpg" alt="躺平猫猫">
                    <img src="static/images/cat_ring.jpg" alt="戒指猫猫">
                </div>
                
                <div style="margin-top: 70px;">
                    <button class="action-btn">👉 挑选经典造型</button>
                </div>
            </div>
        </div>

        <!-- 右侧：魔法衣橱 -->
        <div class="panel panel-right" onmouseenter="updateCat('right')" onclick="location.href='customize.html'">
            <div class="panel-content">
                <div class="panel-title">魔法衣橱</div>
                <div class="panel-desc">想当我的首席设计师吗？施展 AI 魔法，不仅能换装，还能把3D 源文件封进数据胶囊打包带走哦！</div>
                <div class="tag-wrap">
                    <span class="tag" style="color:#ff416c; border: 1px solid #ff416c;">AI 魔法换装</span>
                    <span class="tag">百变造型 DIY</span>
                    <span class="tag">打包 3D 胶囊</span>
                </div>
                
                <div class="preview-images">
                    <img src="/ips/1.png" alt="IP1">
                    <img src="/ips/2.png" alt="IP2">
                    <img src="/ips/3.png" alt="IP3">
                </div>
                
                <div style="margin-top: 70px;">
                    <button class="action-btn">✨ 进入魔法衣橱</button>
                </div>
            </div>
        </div>

        <!-- 中央枢纽 -->
        <div class="center-hub">
            <div class="hub-bg"></div>
            <div id="cat-bubble" class="guide-bubble">
                喵呜~ 欢迎来到龙虾套餐体验馆！<br>准备好见证奇迹了吗？<br>试着把手移到两边看看~
            </div>
            <img id="cat-img" src="static/images/cat.gif" alt="向导猫咪" class="guide-cat">
        </div>
    </div>

<script>
        const bubble = document.getElementById('cat-bubble');
        const container = document.getElementById('container');
        const catImg = document.getElementById('cat-img');

        const CAT_DEFAULT_GIF = 'static/images/cat.gif';
        const CAT_GUIDE_PNG = 'static/images/cat_guide.png';
        const CAT_GUIDE_MIR_PNG = 'static/images/cat_guide_mir.png'; // 新增：指向右侧的图片

        container.addEventListener('mouseleave', () => {
            catImg.src = CAT_DEFAULT_GIF;
            bubble.innerHTML = '喵呜~ 欢迎来到龙虾套餐体验馆！<br>准备好见证奇迹了吗？<br>试着把手移到两边看看~';
        });

        function updateCat(side) {
            if (side === 'left') {
                catImg.src = CAT_GUIDE_PNG; // 鼠标在左侧时，猫咪向左指
                bubble.innerHTML = '叮—— 看来你是个行动派！<br>快来挑选，3D打印机已经预热完毕啦，立刻就能把我带走！';
            } else {
                catImg.src = CAT_GUIDE_MIR_PNG; // 鼠标在右侧时，猫咪向右指
                bubble.innerHTML = '哇哦！大设计师！<br>我已经迫不及待想试试你搭配的新衣服了，快点开始吧！';
            }
        }
    </script>
</body>
</html>
