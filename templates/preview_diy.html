<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaX 空间站 - AI 3D 重构预览</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'PingFang SC', sans-serif; background: #08080c; color: #fff; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at center, #1a0f1c 0%, #050508 100%);}
        
        .top-bar { position: absolute; top: 40px; right: 60px; z-index: 100; }
        .logo { height: 35px; opacity: 0.9; }

        /* ==== 加载罩层 ==== */
        #loading-view { display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; gap: 80px; position: absolute; inset: 0; background: #050508; z-index: 50;}
        .loading-card { background: rgba(255, 65, 108, 0.05); border: 2px solid #ff416c; border-radius: 20px; padding: 50px; width: 550px; position: relative; box-shadow: 0 0 30px rgba(255,65,108,0.1); }
        .loading-title { font-size: 32px; font-weight: bold; margin-bottom: 20px; letter-spacing: 2px;}
        .loading-highlight { color: #ff416c; font-size: 40px; text-shadow: 0 0 15px rgba(255,65,108,0.5); }
        .loading-sub { font-size: 18px; color: #aaa; margin-bottom: 40px; letter-spacing: 1px;}
        .progress-box { width: 100%; height: 10px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #00F0FF, #ff416c); box-shadow: 0 0 15px #ff416c; transition: width 0.1s linear; }
        .cat-think { width: 350px; filter: drop-shadow(0 0 20px rgba(255,65,108,0.15)); animation: float 3s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        /* ==== 预览界面 ==== */
        #main-view { display: none; width: 100%; height: 100%; padding-top: 80px; }
        
        .left-stage { flex: 5.5; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; border-right: 1px solid rgba(255,255,255,0.05); }
        .header-title { position: absolute; top: 20px; left: 60px; }
        .title-text { font-size: 38px; font-weight: bold; color: #fff; margin-bottom: 12px; letter-spacing: 2px;}
        .sub-text { font-size: 18px; color: #ff416c; opacity: 0.8;}
        
        .stage-center { position: relative; width: 100%; height: 60%; display: flex; justify-content: center; align-items: center; }
        .stage-ground { position: absolute; bottom: 0; width: 400px; height: 80px; background: radial-gradient(ellipse at center, rgba(255,65,108,0.2) 0%, transparent 70%); border: 1px dashed rgba(255,65,108,0.3); border-radius: 50%; transform: rotateX(75deg); box-shadow: 0 0 30px rgba(255,65,108,0.1); }
        
        /* 优化：缩短过渡动画的过渡时间，从 0.4s 加快到 0.25s，让隐去更利落 */
        .model-img { max-width: 80%; max-height: 100%; z-index: 10; object-fit: contain; animation: float 4s infinite ease-in-out; filter: drop-shadow(0 20px 30px rgba(0,0,0,0.8)); transition: opacity 0.25s ease, filter 0.25s ease, transform 0.25s ease;}
        
        /* 三视图切换按钮样式 */
        .view-controls { display: flex; gap: 15px; margin-top: 30px; z-index: 20; }
        .btn-view { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); color: #ccc; padding: 12px 30px; border-radius: 20px; font-size: 18px; cursor: pointer; transition: all 0.3s; }
        .btn-view:hover { background: rgba(255, 65, 108, 0.1); border-color: #ff416c; color: #fff; }
        .btn-view.active { background: linear-gradient(90deg, #ff416c, #ff4b2b); border-color: transparent; color: #fff; box-shadow: 0 0 15px rgba(255, 65, 108, 0.4); }

        /* 特效粒子扫描光环 (动画时间加快，配合紧凑节奏) */
        .scan-effect { position: absolute; width: 280px; height: 38px; z-index: 15; display: none; pointer-events: none; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(0, 240, 255, 0.6) 0%, rgba(255, 65, 108, 0.2) 50%, transparent 100%); filter: blur(4px); box-shadow: 0 0 20px rgba(0, 240, 255, 0.5); animation: scanVibrate 0.8s infinite ease-in-out; }
        @keyframes scanVibrate { 0%, 100% { transform: translateY(-80px) scale(0.9); opacity: 0.3; } 50% { transform: translateY(80px) scale(1.1); opacity: 0.9; } }

        .right-panel { flex: 4.5; padding: 40px 60px; display: flex; flex-direction: column; justify-content: center; }
        
        .guide-area { display: flex; align-items: center; gap: 25px; margin-bottom: 50px; }
        .guide-cat { width: 260px; filter: drop-shadow(0 0 15px rgba(255,65,108,0.1)); }
        .guide-bubble { background: rgba(255,65,108,0.05); border: 1px solid #ff416c; padding: 25px 35px; border-radius: 16px; color: #ddd; font-size: 22px; line-height: 1.6; position: relative; flex: 1; box-shadow: inset 0 0 20px rgba(255,65,108,0.05); min-height: 110px;}
        .guide-bubble::before { content: ''; position: absolute; top: 50%; left: -14px; transform: translateY(-50%); border-right: 14px solid #ff416c; border-top: 10px solid transparent; border-bottom: 10px solid transparent; }

        .dock-card { background: rgba(20,20,25,0.8); padding: 50px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 15px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column;}
        .dock-title { font-size: 28px; font-weight: bold; margin-bottom: 35px; letter-spacing: 1px;}
        
        .info-group { margin-bottom: 30px; }
        .info-label { font-size: 18px; color: #666; margin-bottom: 8px; }
        .info-val { font-size: 26px; font-weight: bold; color: #fff; }
        .info-val.cyan { color: #ff416c; font-size: 22px;}

        .btn-group { display: flex; gap: 20px; margin-top: 20px; }
        .btn-back { background: transparent; border: 1px solid #444; color: #aaa; padding: 20px 35px; border-radius: 35px; font-size: 20px; cursor: pointer; transition: 0.3s; }
        .btn-back:hover { background: rgba(255,255,255,0.05); color: #fff; border-color: #fff;}
        .btn-confirm { background: linear-gradient(90deg, #ff416c, #ff4b2b); flex: 1; color: #fff; border: none; border-radius: 40px; font-size: 26px; font-weight: bold; cursor: pointer; box-shadow: 0 8px 25px rgba(255,65,108,0.4); transition: 0.3s; letter-spacing: 2px;}
        .btn-confirm:hover { transform: scale(1.02); box-shadow: 0 12px 35px rgba(255,65,108,0.6); }
    </style>
</head>
<body>

    <div class="top-bar">
        <img src="static/images/meta_logo.png" alt="Logo" class="logo">
    </div>

    <div id="loading-view">
        <div class="loading-card">
            <div class="loading-title">正在为您生成专属 <span class="loading-highlight">3D 模型</span>...</div>
            <div id="loading-text" class="loading-sub">解析服装与配饰参数中...</div>
            <div class="progress-box"><div id="loading-bar" class="progress-bar"></div></div>
        </div>
        <img src="static/images/cat_think.png" class="cat-think">
    </div>

    <div id="main-view">
        <div class="left-stage">
            <div class="header-title">
                <div class="title-text">3D 模型全景预览</div>
                <div class="sub-text">AI 已将您的专属设计具现化</div>
            </div>
            
            <div class="stage-center">
                <div class="stage-ground"></div>
                <div id="scan-layer" class="scan-effect"></div>
                <img id="model-display" src="" class="model-img">
            </div>

            <!-- 三视图切换控制按钮组 -->
            <div class="view-controls">
                <button class="btn-view active" onclick="switchView('front', this)">正面</button>
                <button class="btn-view" onclick="switchView('side', this)">侧面</button>
                <button class="btn-view" onclick="switchView('back', this)">背面</button>
            </div>
        </div>

        <div class="right-panel">
            <div class="guide-area">
                <img src="static/images/video-to-gif-1783478310857_matting.gif" class="guide-cat">
                <div id="guide-bubble" class="guide-bubble">
                    喵呜！这就是根据您的搭配生成的 3D 模型实体啦！<br>
                    如果满意的话，就可以进入下一步扫码提取咯~
                </div>
            </div>

            <div class="dock-card">
                <div class="dock-title">模型封装确认舱</div>
                
                <div class="info-group">
                    <div class="info-label">模型状态</div>
                    <div class="info-val">3D 拓扑结构构建完毕 ✅</div>
                </div>
                <div class="info-group">
                    <div class="info-label">渲染精度</div>
                    <div class="info-val cyan">超高精度 / 支持多颜色打印</div>
                </div>
                
                <div class="btn-group">
                    <button class="btn-back" onclick="location.href='customize.html'">返回重选</button>
                    <button class="btn-confirm" onclick="goTakeaway()">确认并生成数字凭证</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const c = urlParams.get('c') || 0;
        const o = urlParams.get('o') || 0;

        // 把当前搭配(c/o)带到 takeaway，让二维码指向 OSS 上该搭配的三视图+视频打包文件
        function goTakeaway() {
            location.href = `takeaway.html?name=DIY定制款&c=${encodeURIComponent(c)}&o=${encodeURIComponent(o)}`;
        }

        const modelDisplay = document.getElementById('model-display');
        const scanLayer = document.getElementById('scan-layer');
        const guideBubble = document.getElementById('guide-bubble');

        // 三视图统一取 static/xixi_diy/3D 下对应文件
        // 侧/背视图尚未扣好——缺图时 onerror 自动回退到占位图
        const PLACEHOLDER = 'static/images/view_placeholder.png';
        const viewImages = {
            front: `static/xixi_diy/3D/${c}_cloth_o${o}.png`,
            side: `static/xixi_diy/3D/${c}_cloth_o${o}side.png`,
            back: `static/xixi_diy/3D/${c}_cloth_o${o}back.png`
        };
        // 任意视图加载失败（多为侧/背未就绪）→ 顶上占位图，避免图裂
        modelDisplay.onerror = () => {
            if (modelDisplay.src.indexOf('view_placeholder') === -1) modelDisplay.src = PLACEHOLDER;
        };

        const xixiDialogues = {
            scanning: "喵呜~ 正在对模型进行空间维度旋转描准，请稍等哦...",
            front: "喵呜！正面看来剪裁完美贴合，比例超棒的！如果满意的话，就可以进入下一步扫码提取咯~",
            side: "哇！侧面的线条设计也非常流畅细腻呢，快看看侧边的饰品搭配是否合你的心意~",
            back: "嘿嘿，背后也同样细节满满，完美无死角！不管从哪个角度看都超级可爱精致呢！"
        };

        modelDisplay.src = viewImages.front;

        let isSwitching = false; 
        
        // 💡 节奏调校：缩短到 0.5s 空顿，总计 1.6s 左右平滑呈现
        function switchView(viewType, btnElement) {
            if (isSwitching) return;
            isSwitching = true;

            document.querySelectorAll('.btn-view').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            guideBubble.innerHTML = xixiDialogues.scanning;

            // 1. 第一阶段：旧图在 0.25 秒内利落地完全淡出
            modelDisplay.style.opacity = '0';
            modelDisplay.style.filter = 'blur(6px)';
            modelDisplay.style.transform = 'scale(0.9) translateY(10px)';

            // 2. 第二阶段：展现扫描动画
            setTimeout(() => {
                scanLayer.style.display = 'block';
            }, 100);

            // 3. 第三阶段：在总计 0.75 秒时（旧图隐藏后空顿了约0.5秒），静默完成换图并柔和展现新图
            setTimeout(() => {
                modelDisplay.src = viewImages[viewType];
                
                setTimeout(() => {
                    scanLayer.style.display = 'none';
                    modelDisplay.style.opacity = '1';
                    modelDisplay.style.filter = 'none';
                    modelDisplay.style.transform = 'scale(1) translateY(0)';
                    guideBubble.innerHTML = xixiDialogues[viewType];
                    
                    isSwitching = false;
                }, 50); 
                
            }, 750); // 0.25秒淡出 + 0.5秒完全看不见旧图的“空顿扫描期”
        }

        window.onload = () => {
            const bar = document.getElementById('loading-bar');
            const text = document.getElementById('loading-text');
            let progress = 0;
            const texts = ["解析服装与配饰参数中...", "正在进行三维空间投射...", "纹理贴图自动寻址中...", "专属模型生成完毕！"];

            const interval = setInterval(() => {
                progress += 2;
                bar.style.width = progress + '%';
                
                if (progress === 30) text.innerText = texts[1];
                if (progress === 60) text.innerText = texts[2];
                
                if (progress >= 100) {
                    clearInterval(interval);
                    text.innerText = texts[3];
                    text.style.color = "#ff416c";
                    setTimeout(() => {
                        document.getElementById('loading-view').style.display = 'none';
                        document.getElementById('main-view').style.display = 'flex';
                    }, 600);
                }
            }, 50); 
        };
    </script>
</body>
</html>
