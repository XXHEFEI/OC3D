<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaX 空间站 - 扫码提取与打印</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'PingFang SC', sans-serif; background: #050508; color: #fff; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at center, #1a0f1c 0%, #050508 100%);}
        
        .top-bar { position: absolute; top: 40px; width: 100%; display: flex; justify-content: flex-end; padding: 0 60px; z-index: 100; pointer-events: none; align-items: center; }
        .logo { height: 35px; opacity: 0.9; }

        .takeaway-card {
            background: rgba(20, 20, 25, 0.85); border: 2px solid rgba(255, 65, 108, 0.3);
            border-radius: 30px; padding: 50px 70px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), inset 0 0 40px rgba(255,65,108,0.05);
            backdrop-filter: blur(20px); position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center;
            max-width: 800px;
        }

        .title { font-size: 40px; font-weight: bold; color: #fff; margin-bottom: 15px; letter-spacing: 2px;}
        
        .subtitle { font-size: 20px; color: #ddd; margin-bottom: 35px; letter-spacing: 1px; line-height: 1.6;}
        .highlight-text { color: #ff416c; font-size: 18px; font-weight: bold;}

        .qr-container {
            position: relative; width: 280px; height: 280px; padding: 20px;
            background: rgba(255,255,255,0.05); border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 40px;
        }
        .qr-container::before, .qr-container::after { content: ''; position: absolute; width: 30px; height: 30px; border-color: #ff416c; border-style: solid; }
        .qr-container::before { top: -2px; left: -2px; border-width: 4px 0 0 4px; border-top-left-radius: 10px;}
        .qr-container::after { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; border-bottom-right-radius: 10px;}
        .qr-container .corner-tr { position: absolute; top: -2px; right: -2px; width: 30px; height: 30px; border-top: 4px solid #ff416c; border-right: 4px solid #ff416c; border-top-right-radius: 10px;}
        .qr-container .corner-bl { position: absolute; bottom: -2px; left: -2px; width: 30px; height: 30px; border-bottom: 4px solid #ff416c; border-left: 4px solid #ff416c; border-bottom-left-radius: 10px;}

        .qr-image { width: 100%; height: 100%; background: #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;}
        
        /* 初始隐藏二维码图片 */
        .qr-image img { width: 100%; height: 100%; object-fit: contain; padding: 10px; display: none; opacity: 0; transition: opacity 0.5s ease;}
        
        /* 新增：缓冲加载动画样式 */
        .loading-text { font-size: 18px; font-weight: bold; color: #ff416c; animation: pulse 1.5s infinite; letter-spacing: 1px; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .btn-group { display: flex; gap: 20px; width: 100%; justify-content: center; }

        .btn-secondary { 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); 
            color: #ccc; padding: 18px 40px; border-radius: 40px; font-size: 22px; 
            cursor: pointer; transition: all 0.3s; letter-spacing: 1px;
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); color: #fff; border-color: #fff;}

        .finish-btn { 
            background: linear-gradient(90deg, #ff416c, #ff4b2b); color: #fff; border: none; 
            padding: 18px 40px; border-radius: 40px; font-size: 22px; font-weight: bold; 
            cursor: pointer; box-shadow: 0 10px 30px rgba(255, 65, 108, 0.4); transition: all 0.3s; letter-spacing: 1px; 
        }
        .finish-btn:hover { transform: scale(1.05); box-shadow: 0 15px 40px rgba(255, 65, 108, 0.6); }

        .cat-guide { position: absolute; bottom: -50px; left: -180px; width: 220px; filter: drop-shadow(0 0 20px rgba(255,65,108,0.2));}
    </style>
</head>
<body>

    <div class="top-bar">
        <img src="static/images/meta_logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
    </div>

    <div class="takeaway-card">
        <div class="title">数字资产已就绪</div>
        
        <div class="subtitle">
            请使用手机扫码，提取您的专属 3D 模型压缩包<br>
            <span class="highlight-text">🎁 (解压后内含您的专属 DIY 惊喜小视频哦！)</span>
        </div>
        
        <div class="qr-container">
            <div class="corner-tr"></div>
            <div class="corner-bl"></div>
            <div id="qrcode-box" class="qr-image">
                <!-- 缓冲加载文案 -->
                <div id="loading-tip" class="loading-text">正在生成专属提取码...</div>
                <img id="static-qr" src="" alt="提取二维码">
            </div>
        </div>

        <div class="btn-group">
            <button class="finish-btn" onclick="location.href='index.html'">结束 / 返回首页</button>
        </div>

        <img src="static/images/cat.png" class="cat-guide" onerror="this.style.display='none'">
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const c = urlParams.get('c'); 
        const o = urlParams.get('o'); 
        
        const qrImageElement = document.getElementById('static-qr');
        const loadingTip = document.getElementById('loading-tip');

        if (c !== null && o !== null) {
            const qrImagePath = `static/qr/${c}_${o}.png`;
            
            // 延迟 2 秒执行，制造系统处理的缓冲感
            setTimeout(() => {
                qrImageElement.src = qrImagePath;
                
                // 确保图片加载完成后再显示，避免看到图片加载一半的闪烁
                qrImageElement.onload = function() {
                    loadingTip.style.display = 'none';
                    qrImageElement.style.display = 'block';
                    // 加上一点小小的透明度渐变动画，显得更平滑
                    setTimeout(() => {
                        qrImageElement.style.opacity = '1';
                    }, 50);
                };
                
                qrImageElement.onerror = function() {
                    loadingTip.style.animation = 'none';
                    loadingTip.innerHTML = '<span style="color:red;font-size:14px;">未能找到对应的二维码，请联系工作人员</span>';
                };
            }, 2000); // 此处的 2000 代表 2 秒缓冲时间，可根据需要微调
            
        } else {
            loadingTip.style.animation = 'none';
            loadingTip.innerHTML = '<span style="color:red;font-size:14px;">未获取到模型参数</span>';
        }
    </script>
</body>
</html>
