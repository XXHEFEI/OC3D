<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D全景预览与切片</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; 
            background: #050508; color: #fff; 
            min-height: 100vh; display: flex; align-items: center; justify-content: center; 
            padding: 20px; overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        /* 统一深邃全景背景 */
        .container { 
            width: 95vw; height: 88vh; 
            background: radial-gradient(circle at 30% 50%, #0d0d1a 0%, #030305 100%); 
            border-radius: 24px; display: flex; overflow: hidden; position: relative; 
            box-shadow: 0 0 50px rgba(0, 217, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.05); 
        }

        /* 全局最高层 Logo */
        .logo { 
            position: absolute; top: 40px; right: 40px; 
            width: 160px; opacity: 0.9; 
            z-index: 150; 
        }

        /* ================= 1. 互动式小猫加载罩层 ================= */
        #loading-view { 
            display: flex; position: absolute; inset: 0; 
            background: radial-gradient(circle at 50% 50%, #121220 0%, #050508 100%); 
            z-index: 100; 
            align-items: center; justify-content: center; 
        }
        
        .loading-container { display: flex; align-items: center; gap: 50px; }
        
        /* 加载界面的思考猫也调回适中大小，不过分夸张 */
        .loading-cat { 
            width: 400px; height: auto; z-index: 10; 
            filter: drop-shadow(0 0 30px rgba(0, 240, 255, 0.2));
            animation: floatCat 3s ease-in-out infinite; 
        }
        
        .loading-bubble { 
            background: rgba(0, 240, 255, 0.05); backdrop-filter: blur(10px);
            border: 2px solid #00F0FF; padding: 40px 50px; border-radius: 24px; 
            box-shadow: 0 0 40px rgba(0,240,255,0.15); position: relative; width: 550px; 
        }
        .loading-bubble::after { 
            content: ''; position: absolute; right: -20px; top: 50%; transform: translateY(-50%);
            border-left: 20px solid #00F0FF; border-top: 15px solid transparent; border-bottom: 15px solid transparent; 
        }

        .loading-title { font-size: 32px; font-weight: bold; color: #fff; margin-bottom: 15px; letter-spacing: 1px;}
        .loading-highlight { color: #00F0FF; font-size: 38px; text-shadow: 0 0 15px rgba(0, 240, 255, 0.5);}
        .loading-sub { font-size: 18px; color: #aaa; margin-bottom: 40px; letter-spacing: 1px; }
        
        .progress-wrapper { width: 100%; height: 12px; background: #1a1a2e; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid rgba(0,240,255,0.2); }
        .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ff416c, #00d9ff); border-radius: 12px; transition: width 0.1s linear; box-shadow: 0 0 20px rgba(0, 217, 255, 0.6); }

        /* ================= 2. 主页面结构 ================= */
        #main-view { display: none; width: 100%; height: 100%; }
        
        /* --- 左侧：3D展台 --- */
        .left { 
            width: 55%; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; 
            border-right: 1px solid rgba(255,255,255,0.05);
        }
        .header-title { position: absolute; top: 40px; left: 50px; }
        .title-text { font-size: 32px; color: #fff; font-weight: bold; margin-bottom: 8px; letter-spacing: 2px;}
        .sub-text { font-size: 16px; color: #00d9ff; opacity: 0.8;}
        
        .stage-container { width: 100%; height: 65%; position: relative; display: flex; align-items: center; justify-content: center; margin-top: 20px; }
        
        .stage-img { max-width: 90%; max-height: 90%; transform: scale(1.1); z-index: 10; object-fit: contain; animation: floatCat 4s ease-in-out infinite; transition: opacity 0.3s; filter: drop-shadow(0 0 25px rgba(0,240,255,0.2)); }
        .stage-ground { position: absolute; bottom: 10px; width: 450px; height: 100px; background: radial-gradient(ellipse at center, rgba(0,240,255,0.25) 0%, rgba(0,0,0,0) 70%); border: 1px dashed rgba(0, 240, 255, 0.2); border-radius: 50%; transform: rotateX(75deg); z-index: 1; box-shadow: 0 0 40px rgba(0, 240, 255, 0.1); }
        
        .control-panel { display: flex; gap: 25px; margin-top: 40px; z-index: 20; background: rgba(0,0,0,0.4); padding: 15px 35px; border-radius: 40px; border: 1px solid rgba(0,240,255,0.1); backdrop-filter: blur(10px); }
        .angle-btn { background: transparent; color: #888; border: none; font-size: 20px; padding: 10px 30px; cursor: pointer; border-radius: 30px; transition: all 0.3s; font-weight: bold; }
        .angle-btn.active { background: linear-gradient(90deg, #00c6ff, #0072ff); color: #fff; box-shadow: 0 0 20px rgba(0, 217, 255, 0.5); }
        .angle-btn:hover:not(.active) { color: #fff; text-shadow: 0 0 10px #00d9ff;}
        
        /* --- 右侧：智能控制台与猫 --- */
        .right { 
            width: 45%; background: #0a0a14; padding: 50px 60px; display: flex; flex-direction: column; justify-content: center; position: relative; 
        }
        
        /* 恢复原来的小猫排版：居中对齐 */
        .guide-section { display: flex; align-items: center; gap: 20px; margin-bottom: 35px; margin-top: 40px;}
        
        /* 🎯 核心修改：恢复 140px 小巧精致尺寸！ */
        .guide-cat { width: 140px; height: auto; z-index: 10; transition: all 0.4s ease; filter: drop-shadow(0 0 15px rgba(0,240,255,0.15)); flex-shrink: 0;}
        
        @keyframes floatCat { 0% { transform: translateY(0px); } 50% { transform: translateY(-12px); } 100% { transform: translateY(0px); } }
        @keyframes cat-working { 0% { transform: translateY(0); } 50% { transform: translateY(-15px) rotate(4deg) scale(1.05); filter: drop-shadow(0 0 30px rgba(255, 65, 108, 0.6)); } 100% { transform: translateY(0); } }
        .cat-generating { animation: cat-working 0.3s infinite; }
        
        /* 气泡美化，箭头居中指向猫咪 */
        .guide-bubble { 
            background: rgba(0, 240, 255, 0.05); backdrop-filter: blur(10px);
            border: 1px solid #00F0FF; padding: 20px 25px; border-radius: 20px; 
            color: #ddd; font-size: 16px; line-height: 1.6; position: relative; 
            box-shadow: 0 0 20px rgba(0,240,255,0.15); flex: 1; transition: all 0.3s; 
        }
        /* 箭头垂直居中 (top:50%)，完美对准小猫 */
        .guide-bubble::before { 
            content: ''; position: absolute; top: 50%; left: -14px; transform: translateY(-50%);
            border-right: 14px solid #00F0FF; border-top: 10px solid transparent; border-bottom: 10px solid transparent; 
        }
        .guide-highlight { color: #00F0FF; font-weight: bold; font-size: 18px; text-shadow: 0 0 10px rgba(0,240,255,0.4); }

        /* 毛玻璃智能控制台卡片 */
        .panel-card { 
            background: rgba(15, 15, 25, 0.6); backdrop-filter: blur(15px);
            border-radius: 24px; padding: 40px; border: 1px solid rgba(0, 240, 255, 0.15); 
            box-shadow: inset 0 0 20px rgba(0,240,255,0.02), 0 20px 40px rgba(0,0,0,0.4);
        }
        
        .info-group { margin-bottom: 25px; }
        .info-label { font-size: 15px; color: #888; margin-bottom: 8px; letter-spacing: 1px;}
        .info-value { font-size: 24px; font-weight: bold; color: #fff; letter-spacing: 1px;}
        
        .progress-container { background: #050508; border-radius: 10px; height: 12px; width: 100%; overflow: hidden; margin-top: 15px; border: 1px solid rgba(255,255,255,0.1); display: none; }
        .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #ff416c, #ff4b2b); box-shadow: 0 0 15px rgba(255, 65, 108, 0.6); transition: width 0.1s linear; }
        .status-text { font-size: 15px; color: #ff416c; margin-top: 12px; font-weight: bold; display: none; letter-spacing: 1px;}

        /* 操作按钮 */
        .btn-container { display: flex; gap: 20px; margin-top: 35px; }
        .back-btn { background: rgba(0,0,0,0.5); color: #aaa; border: 1px solid #333; padding: 18px 35px; border-radius: 30px; font-size: 18px; cursor: pointer; transition: all 0.3s;}
        .back-btn:hover { color: #fff; border-color: #666; background: rgba(255,255,255,0.05);}
        
        .print-btn { 
            background: linear-gradient(90deg, #ff416c, #ff4b2b); flex: 1; color: white; 
            border: none; padding: 18px 0; border-radius: 40px; font-size: 22px; font-weight: bold; 
            cursor: pointer; box-shadow: 0 6px 20px rgba(255, 65, 108, 0.4); transition: all 0.3s; letter-spacing: 2px;
        }
        .print-btn:hover { transform: scale(1.03); box-shadow: 0 10px 30px rgba(255, 65, 108, 0.6); }
    </style>
</head>
<body>
    <div class="container">
        
        <img src="static/images/meta_logo.png" alt="MetaX Logo" class="logo" />

        <div id="loading-view">
            <div class="loading-container">
                <div class="loading-bubble">
                    <div class="loading-title">喵！正在为您生成 <span class="loading-highlight">3D 模型</span>...</div>
                    <div id="loading-text" class="loading-sub">MetaX GPU 集群正在进行特征提取...</div>
                    <div class="progress-wrapper">
                        <div id="loading-bar" class="progress-fill"></div>
                    </div>
                </div>
                
                <img src="static/images/cat_think.png" alt="思考中的向导" class="loading-cat">
            </div>
        </div>

        <div id="main-view">
            <div class="left">
                <div class="header-title">
                    <div class="title-text">3D 模型全景预览</div>
                    <div class="sub-text">支持多视角拨动查看结构细节</div>
                </div>
                <div class="stage-container">
                    <div class="stage-ground"></div>
                    <img id="stage-model" src="/ips/front.png" alt="3D模型" class="stage-img">
                </div>
                <div class="control-panel">
                    <button class="angle-btn active" onclick="rotateView('front', this)">正面</button>
                    <button class="angle-btn" onclick="rotateView('side', this)">侧面</button>
                    <button class="angle-btn" onclick="rotateView('back', this)">背面</button>
                </div>
            </div>

            <div class="right">
                <div class="guide-section">
                    <img id="guideCat" src="static/images/cat.png" alt="向导" class="guide-cat">
                    <div id="guideText" class="guide-bubble">
                        喵！2D 到 3D 重构完成啦~<br>
                        左侧可查看 <span class="guide-highlight">专属IP的三视图</span>。<br>
                        确认无误后点击下方按钮，我就会为您一键切片！
                    </div>
                </div>

                <div class="panel-card">
                    <h3 style="font-size: 24px; color: #fff; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; letter-spacing: 1px;">智能打印全自动对接舱</h3>
                    <div class="info-group">
                        <div class="info-label">待处理目标</div>
                        <div id="target-name" class="info-value">正在读取...</div>
                    </div>
                    <div class="info-group">
                        <div class="info-label">算力平台与模型输出</div>
                        <div class="info-value" style="color: #00d9ff; font-size: 18px;">MetaX GPU集群 / .3mf 高精格式</div>
                    </div>
                    <div>
                        <div class="progress-container" id="progressContainer"><div id="progressBar" class="progress-bar"></div></div>
                        <div id="statusText" class="status-text"></div>
                    </div>
                    <div class="btn-container">
                        <button class="back-btn" onclick="location.href='select.html'">返回重选</button>
                        <button id="actionBtn" class="print-btn" onclick="startSlicing()">确认打印</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const ipName = urlParams.get('name') || '曦曦-经典款';
        const originalImg = urlParams.get('img') || '/ips/1.png'; 
        document.getElementById('target-name').innerText = ipName.replace('-', ' · ');

        // 防破损：如果找不到三视图图片，自动退回原图
        document.getElementById('stage-model').onerror = function() {
            this.onerror = null; this.src = originalImg; 
        };

        // 页面刚加载：跑动画
        window.onload = () => {
            const bar = document.getElementById('loading-bar');
            const text = document.getElementById('loading-text');
            let progress = 0;
            const texts = ["2D 特征提取中...", "生成深度图与点云数据...", "构建三维网格拓扑...", "渲染表面光影...", "3D 空间构建完毕！"];

            const interval = setInterval(() => {
                progress += 2;
                bar.style.width = progress + '%';
                
                if (progress === 20) text.innerText = texts[1];
                if (progress === 50) text.innerText = texts[2];
                if (progress === 80) text.innerText = texts[3];
                
                if (progress >= 100) {
                    clearInterval(interval);
                    text.innerText = texts[4];
                    setTimeout(() => {
                        document.getElementById('loading-view').style.display = 'none';
                        document.getElementById('main-view').style.display = 'flex';
                    }, 500);
                }
            }, 35); 
        };

        // 互动彩蛋：视角切换
        function rotateView(angle, btnElement) {
            document.querySelectorAll('.angle-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            
            const img = document.getElementById('stage-model');
            img.style.opacity = 0; 
            setTimeout(() => { img.src = `/ips/${angle}.png`; img.style.opacity = 1; }, 150);

            const guideText = document.getElementById('guideText');
            if (angle === 'front') {
                guideText.innerHTML = `喵！<span class="guide-highlight">正面</span> 看起来简直完美！<br>细节都还原得很到位呢！`;
            } else if (angle === 'side') {
                guideText.innerHTML = `哇哦~ <span class="guide-highlight">侧面</span> 的立体感好棒！<br>物理结构非常清晰喵！`;
            } else if (angle === 'back') {
                guideText.innerHTML = `<span class="guide-highlight">背面</span> 的元素也没落下！<br>360度无死角的精致，可以放心打印啦！`;
            }
        }

        // 开始切片
        function startSlicing() {
            const actionBtn = document.getElementById('actionBtn');
            const pContainer = document.getElementById('progressContainer');
            const pBar = document.getElementById('progressBar');
            const sText = document.getElementById('statusText');
            const guideCat = document.getElementById('guideCat');
            const guideText = document.getElementById('guideText');

            actionBtn.disabled = true; actionBtn.innerText = "自动化处理中...";
            actionBtn.style.background = "#222"; actionBtn.style.color = "#666"; actionBtn.style.boxShadow = "none";
            pContainer.style.display = "block"; sText.style.display = "block";

            guideCat.classList.add('cat-generating');
            guideText.innerHTML = `🐱 <span style="color:#ff416c; font-weight:bold; font-size:20px; text-shadow: 0 0 10px rgba(255, 65, 108, 0.6);">曦曦正在疯狂运算中...</span><br>正在为您自动连接算力集群并进行网格切片，马上就好！`;
            guideText.style.borderColor = "#ff416c";
            guideText.style.boxShadow = "0 0 25px rgba(255, 65, 108, 0.3)";

            try { fetch('/api/generate', { method: 'POST', body: JSON.stringify({ ip_id: ipName, quality: "standard" }) }); } catch(e){}

            let fakeProgress = 0;
            const timer = setInterval(() => {
                fakeProgress += 2;
                pBar.style.width = fakeProgress + '%';

                if (fakeProgress < 30) sText.innerText = "[处理中] 任务已创建，启动算力集群...";
                else if (fakeProgress < 60) sText.innerText = "[处理中] 高精度网格切片进行中...";
                else if (fakeProgress < 90) sText.innerText = "[处理中] 生成 .3mf 格式并下发至打印机...";

                if (fakeProgress >= 100) {
                    clearInterval(timer);
                    const encName = encodeURIComponent(ipName);
                    const encImg = encodeURIComponent(originalImg);
                    location.href = `printing.html?name=${encName}&img=${encImg}`;
                }
            }, 60); 
        }
    </script>
</body>
</html>
