<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 模型全景预览</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'PingFang SC', sans-serif; background: #08080c; color: #fff; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        
        .top-bar { position: absolute; top: 40px; right: 60px; z-index: 100; }
        .logo { height: 30px; opacity: 0.9; }

        /* ================= 1. 加载罩层 ================= */
        #loading-view { display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; gap: 80px; position: absolute; inset: 0; background: radial-gradient(circle at center, #0f172a 0%, #050508 100%); z-index: 50;}
        
        .loading-card { background: rgba(0, 240, 255, 0.05); border: 2px solid #00F0FF; border-radius: 20px; padding: 50px; width: 550px; position: relative; box-shadow: 0 0 30px rgba(0,240,255,0.1); }
        /* 指向猫的右侧小箭头 */
        .loading-card::after { content: ''; position: absolute; top: 50%; right: -22px; transform: translateY(-50%); border-left: 22px solid #00F0FF; border-top: 15px solid transparent; border-bottom: 15px solid transparent; }
        
        .loading-title { font-size: 32px; font-weight: bold; margin-bottom: 20px; letter-spacing: 2px;}
        .loading-highlight { color: #00F0FF; font-size: 40px; text-shadow: 0 0 15px rgba(0,240,255,0.5); }
        .loading-sub { font-size: 18px; color: #aaa; margin-bottom: 40px; letter-spacing: 1px;}
        
        .progress-box { width: 100%; height: 10px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #ff416c, #00F0FF); box-shadow: 0 0 15px #00F0FF; transition: width 0.1s linear; }

        .cat-think { width: 350px; filter: drop-shadow(0 0 20px rgba(0,240,255,0.15)); animation: float 3s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

        /* ================= 2. 预览界面 ================= */
        #main-view { display: none; width: 100%; height: 100%; padding-top: 80px; }
        
        /* 左侧：3D全景展台 */
        .left-stage { flex: 5.5; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; border-right: 1px solid rgba(255,255,255,0.05); }
        .header-title { position: absolute; top: 20px; left: 60px; }
        .title-text { font-size: 32px; font-weight: bold; color: #fff; margin-bottom: 10px; letter-spacing: 2px;}
        .sub-text { font-size: 16px; color: #00F0FF; opacity: 0.8;}
        
        .stage-center { position: relative; width: 100%; height: 60%; display: flex; justify-content: center; align-items: center; }
        .stage-ground { position: absolute; bottom: 0; width: 400px; height: 80px; background: radial-gradient(ellipse at center, rgba(0,240,255,0.2) 0%, transparent 70%); border: 1px dashed rgba(0,240,255,0.3); border-radius: 50%; transform: rotateX(75deg); box-shadow: 0 0 30px rgba(0,240,255,0.1); }
        .model-img { max-width: 70%; max-height: 90%; z-index: 10; object-fit: contain; animation: float 4s infinite ease-in-out; filter: drop-shadow(0 20px 30px rgba(0,0,0,0.8));}
        
        .controls { display: flex; gap: 20px; margin-top: 40px; background: rgba(255,255,255,0.02); padding: 15px 30px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(10px);}
        .angle-btn { background: transparent; border: none; color: #888; font-size: 18px; cursor: pointer; padding: 10px 30px; border-radius: 30px; font-weight: bold; transition: 0.3s; letter-spacing: 1px;}
        .angle-btn.active { background: linear-gradient(90deg, #00c6ff, #0072ff); color: #fff; box-shadow: 0 5px 15px rgba(0,198,255,0.4);}
        .angle-btn:hover:not(.active) { color: #fff; }

        /* 右侧：确认对接舱 */
        .right-panel { flex: 4.5; padding: 40px 80px; display: flex; flex-direction: column; justify-content: center; }
        
        .guide-area { display: flex; align-items: center; gap: 20px; margin-bottom: 50px; }
        .guide-cat { width: 140px; filter: drop-shadow(0 0 15px rgba(0,240,255,0.1)); }
        .guide-bubble { background: rgba(0,240,255,0.05); border: 1px solid #00F0FF; padding: 20px 25px; border-radius: 16px; color: #ddd; font-size: 18px; line-height: 1.6; position: relative; flex: 1; box-shadow: inset 0 0 20px rgba(0,240,255,0.05);}
        .guide-bubble::before { content: ''; position: absolute; top: 50%; left: -14px; transform: translateY(-50%); border-right: 14px solid #00F0FF; border-top: 10px solid transparent; border-bottom: 10px solid transparent; }
        .guide-highlight { color: #00F0FF; font-weight: bold; }

        .dock-card { background: rgba(20,20,25,0.8); padding: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 15px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column;}
        .dock-title { font-size: 24px; font-weight: bold; margin-bottom: 30px; letter-spacing: 1px;}
        
        .info-group { margin-bottom: 25px; }
        .info-label { font-size: 14px; color: #666; margin-bottom: 8px; }
        .info-val { font-size: 22px; font-weight: bold; color: #fff; }
        .info-val.cyan { color: #00F0FF; font-size: 18px;}

        .btn-group { display: flex; gap: 20px; margin-top: 20px; }
        .btn-back { background: transparent; border: 1px solid #444; color: #aaa; padding: 18px 30px; border-radius: 30px; font-size: 18px; cursor: pointer; transition: 0.3s; }
        .btn-back:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .btn-confirm { background: linear-gradient(90deg, #ff416c, #ff4b2b); flex: 1; color: #fff; border: none; border-radius: 40px; font-size: 22px; font-weight: bold; cursor: pointer; box-shadow: 0 8px 25px rgba(255,65,108,0.4); transition: 0.3s; letter-spacing: 2px;}
        .btn-confirm:hover { transform: scale(1.02); box-shadow: 0 12px 35px rgba(255,65,108,0.6); }

    </style>
</head>
<body>

    <div class="top-bar">
        <img src="static/images/meta_logo.png" alt="Logo" class="logo">
    </div>

    <div id="loading-view">
        <div class="loading-card">
            <div class="loading-title">喵！正在为您生成 <span class="loading-highlight">3D 模型</span>...</div>
            <div id="loading-text" class="loading-sub">2D 特征提取中...</div>
            <div class="progress-box"><div id="loading-bar" class="progress-bar"></div></div>
        </div>
        <img src="static/images/cat_think.png" class="cat-think">
    </div>

    <div id="main-view">
        <div class="left-stage">
            <div class="header-title">
                <div class="title-text">3D 模型全景预览</div>
                <div class="sub-text">支持多视角拨动查看结构细节</div>
            </div>
            
            <div class="stage-center">
                <div class="stage-ground"></div>
                <img id="model-display" src="" class="model-img">
            </div>

            <div class="controls">
                <button class="angle-btn active" onclick="changeAngle('front', this)">正面</button>
                <button class="angle-btn" onclick="changeAngle('side', this)">侧面</button>
                <button id="btn-back-view" class="angle-btn" onclick="changeAngle('back', this)">背面</button>
            </div>
        </div>

        <div class="right-panel">
            <div class="guide-area">
                <img src="static/images/cat.png" class="guide-cat">
                <div id="guide-bubble" class="guide-bubble">
                    喵！<span class="guide-highlight">正面</span> 看起来简直完美！<br>细节都还原得很到位呢！
                </div>
            </div>

            <div class="dock-card">
                <div class="dock-title">智能打印全自动对接舱</div>
                
                <div class="info-group">
                    <div class="info-label">待处理目标</div>
                    <div id="data-name" class="info-val">读取中...</div>
                </div>
                <div class="info-group">
                    <div class="info-label">算力平台与模型输出</div>
                    <div class="info-val cyan">MetaX GPU集群 / .3mf 高精格式</div>
                </div>
                
                <div class="btn-group">
                    <button class="btn-back" onclick="location.href='select_classic.html'">返回重选</button>
                    <button class="btn-confirm" onclick="confirmPrint()">确认打印</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. 获取 URL 传过来的选中参数
        const urlParams = new URLSearchParams(window.location.search);
        const modelName = urlParams.get('name') || '经典款';
        const originalImg = urlParams.get('img') || 'static/images/cat_lay.jpg';

        // 2. 核心逻辑：智能解析图片路径
        const lastDotIndex = originalImg.lastIndexOf('.');
        const basePath = originalImg.substring(0, lastDotIndex); // 例如: static/images/cat_lay

        // 【关键修复1】强制使用 .png 后缀（因为你的三视图全都是 .png 格式）
        const imgFront = `${basePath}_front.png`;
        const imgSide = `${basePath}_side.png`;
        
        // 【关键修复2】专门针对 cat_lay (躺平猫猫) 的 _top 处理
        let imgBack = `${basePath}_back.png`; // 拼接出来是 cat_base_back.png
        const isCatLay = basePath.includes('cat_lay');
        
        if (isCatLay) {
            imgBack = `${basePath}_top.png`; // 躺平猫猫使用的是 _top.png
            document.getElementById('btn-back-view').innerText = '顶面'; // 动态修改按钮文字
        }

        // 初始化界面内容
        document.getElementById('data-name').innerText = modelName;
        const modelDisplay = document.getElementById('model-display');
        
        // 默认首先展示正面视图
        modelDisplay.src = imgFront;

        // 页面刚加载：执行进度条动画
        window.onload = () => {
            const bar = document.getElementById('loading-bar');
            const text = document.getElementById('loading-text');
            let progress = 0;
            const texts = ["2D 特征提取中...", "生成深度图与点云数据...", "构建三维网格拓扑...", "3D 空间构建完毕！"];

            const interval = setInterval(() => {
                progress += 2;
                bar.style.width = progress + '%';
                
                if (progress === 30) text.innerText = texts[1];
                if (progress === 60) text.innerText = texts[2];
                
                if (progress >= 100) {
                    clearInterval(interval);
                    text.innerText = texts[3];
                    text.style.color = "#00F0FF";
                    setTimeout(() => {
                        // 隐藏加载，显示主界面
                        document.getElementById('loading-view').style.display = 'none';
                        document.getElementById('main-view').style.display = 'flex';
                    }, 600);
                }
            }, 30); 
        };

        // 视角拨动交互
        function changeAngle(angle, btn) {
            document.querySelectorAll('.angle-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const bubble = document.getElementById('guide-bubble');
            
            if(angle === 'front') {
                modelDisplay.src = imgFront;
                bubble.innerHTML = `喵！<span class="guide-highlight">正面</span> 看起来简直完美！<br>细节都还原得很到位呢！`;
            }
            if(angle === 'side') {
                modelDisplay.src = imgSide;
                bubble.innerHTML = `哇哦~ <span class="guide-highlight">侧面</span> 的立体感好棒！<br>物理结构非常清晰喵！`;
            }
            if(angle === 'back') {
                modelDisplay.src = imgBack;
                // 如果是躺平猫猫，改变文案为“顶面”
                if (isCatLay) {
                    bubble.innerHTML = `<span class="guide-highlight">顶面</span> 的视角也好可爱！<br>摊成一张猫饼啦，可以放心打印！`;
                } else {
                    bubble.innerHTML = `<span class="guide-highlight">背面</span> 的元素也没落下！<br>360度无死角的精致，可以放心打印啦！`;
                }
            }
        }

        // 跳转去打印 (往下传递原始图片参数，以备后续环节使用)
        function confirmPrint() {
            const modelId = urlParams.get('id') || '';
            const modelFile = urlParams.get('model') || '';
            location.href = `printing_classic.html?name=${encodeURIComponent(modelName)}&img=${encodeURIComponent(originalImg)}&id=${encodeURIComponent(modelId)}&model=${encodeURIComponent(modelFile)}`;
        }
    </script>
</body>
</html>
