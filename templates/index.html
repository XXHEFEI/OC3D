<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP Print Web</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: #0f1117; color: #e8e8e8; height: 100vh; overflow: hidden;
  display: flex; flex-direction: column;
}

header {
  background: #1a1d27; padding: 10px 20px; border-bottom: 1px solid #2a2d3a;
  display: flex; align-items: center; gap: 12px; flex-shrink: 0;
}
header h1 { font-size: 15px; font-weight: 700; color: #7c5cff; letter-spacing: 2px; }
header .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; flex-shrink: 0; }
header .conn-dot.on { background: #4ade80; }
header .conn-dot.error { background: #f87171; }
header .params-bar { margin-left: auto; font-size: 11px; color: #666; display: flex; gap: 16px; }
header .params-bar b { color: #ccc; }

main { display: flex; flex: 1; overflow: hidden; }

/* ── Left: IP selection ── */
.ip-panel {
  width: 280px; flex-shrink: 0; overflow-y: auto; padding: 16px;
  border-right: 1px solid #2a2d3a; background: #14161f;
  display: flex; flex-direction: column; gap: 10px;
}
.ip-panel h3 { font-size: 11px; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: 1px; }
.ip-card {
  background: #1a1d27; border: 2px solid #2a2d3a; border-radius: 10px;
  overflow: hidden; cursor: pointer; transition: all 0.2s;
}
.ip-card:hover { border-color: #7c5cff55; }
.ip-card.selected { border-color: #7c5cff; box-shadow: 0 0 12px #7c5cff22; }
.ip-card .ip-preview { width: 100%; height: 240px; object-fit: contain; display: block; background: #0f1117; }
.ip-card .ip-label { padding: 10px 12px; font-size: 13px; font-weight: 600; color: #ccc; display: flex; align-items: center; gap: 6px; }
.ip-card .ip-label .badge { font-size: 10px; padding: 2px 6px; border-radius: 6px; background: #2a2d3a; color: #888; }
.ip-card.selected .ip-label { color: #fff; }
.ip-card.selected .badge { background: #7c5cff33; color: #7c5cff; }

/* ── Right: Process ── */
.process-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #0f1117; }
.process-panel .empty {
  flex: 1; display: flex; align-items: center; justify-content: center;
  color: #444; font-size: 13px; text-align: center; line-height: 1.8;
}

/* Breathing status indicator */
.status-indicator {
  padding: 16px 20px; display: none; align-items: center; gap: 10px;
}
.status-indicator.show { display: flex; }
.status-indicator .breath {
  width: 12px; height: 12px; border-radius: 50%;
  background: #7c5cff; box-shadow: 0 0 14px #7c5cffaa;
  animation: pulse 1.5s ease-in-out infinite; flex-shrink: 0;
}
.status-indicator .status-text { font-size: 13px; color: #888; }

/* Agent output */
.output { flex: 1; overflow-y: auto; padding: 0 20px 16px; display: flex; flex-direction: column; gap: 6px; }
.output .line { font-size: 12px; line-height: 1.5; color: #888; padding-left: 10px; border-left: 2px solid #2a2d3a; }
.output .line:empty { display: none; }

/* Download */
.dl-card { margin: 0 20px 16px; background: #1a2a1a; border: 1px solid #4ade8044; border-radius: 10px; padding: 14px; text-align: center; }
.dl-card h3 { color: #4ade80; font-size: 14px; margin-bottom: 8px; }
.dl-card a { display: inline-block; background: #4ade80; color: #000; font-weight: 700; padding: 8px 20px; border-radius: 6px; text-decoration: none; font-size: 12px; }

.action-bar { padding: 12px 20px; border-top: 1px solid #2a2d3a; background: #14161f; flex-shrink: 0; display: flex; align-items: center; gap: 12px; }
.btn-print { background: #7c5cff; border: none; border-radius: 8px; color: #fff; font-size: 15px; font-weight: 700; padding: 12px 40px; cursor: pointer; transition: background 0.15s; }
.btn-print:hover { background: #6a4de0; }
.btn-print:disabled { background: #2a2d3a; color: #555; cursor: not-allowed; }
.action-bar .hint { font-size: 11px; color: #555; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: #2a2d3a; border-radius: 2px; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
</style>
</head>
<body>

<header>
  <div class="conn-dot" id="conn-dot"></div>
  <h1>IP Print Web</h1>
</header>

<main>
  <aside class="ip-panel" id="ip-panel"><h3>选择形象</h3></aside>

  <section class="process-panel">
    <div class="status-indicator" id="status-indicator">
      <span class="breath"></span>
      <span class="status-text" id="status-text">处理中...</span>
    </div>
    <div class="output" id="output"></div>
    <div class="empty" id="empty">选择左侧形象，点击「开始打印」</div>
    <div id="download"></div>
    <div class="action-bar">
      <button class="btn-print" id="btn-print" disabled>开始打印</button>
      <span class="hint" id="action-hint">请先选择一个形象</span>
    </div>
  </section>
</main>

<script src="/static/gateway.js"></script>
<script src="/static/prompt.js"></script>

<script>
// ─── DOM refs ─────────────────────────────────────────────────────────────
const $ipPanel   = document.getElementById('ip-panel');
const $statusInd = document.getElementById('status-indicator');
const $statusText = document.getElementById('status-text');
const $output    = document.getElementById('output');
const $empty     = document.getElementById('empty');
const $download  = document.getElementById('download');
const $btnPrint  = document.getElementById('btn-print');
const $hint      = document.getElementById('action-hint');
const $connDot   = document.getElementById('conn-dot');

// ─── Render IP cards ──────────────────────────────────────────────────────
function renderIPCards() {
  $ipPanel.innerHTML = '<h3>选择形象</h3>' + COSTUMES.map(c => `
    <div class="ip-card" data-id="${c.id}" onclick="selectCostume('${c.id}')">
      <img class="ip-preview" src="${c.image}" alt="${c.name}" loading="lazy">
      <div class="ip-label">${c.name}<span class="badge">2D→3D</span></div>
    </div>
  `).join('');
}

// ─── State ────────────────────────────────────────────────────────────────
let gateway, selectedCostume, isPrinting = false;
let taskId = null;

// ─── Breathing indicator ──────────────────────────────────────────────────
function showBreathing(msg) {
  $statusText.textContent = msg || '处理中...';
  $statusInd.classList.add('show');
}

function hideBreathing() {
  $statusInd.classList.remove('show');
}

// ─── Output ───────────────────────────────────────────────────────────────
function hideEmpty() { $empty.style.display = 'none'; }

function addLine(text, cls) {
  hideEmpty();
  const div = document.createElement('div');
  div.className = 'line ' + (cls || '');
  div.textContent = text;
  $output.appendChild(div);
  $output.scrollTop = $output.scrollHeight;
}

function showDownload(url) {
  $download.innerHTML = `<div class="dl-card"><h3>打印完成</h3><a href="${url}" download>下载 .3mf 文件</a></div>`;
  $btnPrint.disabled = false;
  $btnPrint.textContent = '开始打印';
  isPrinting = false;
  hideBreathing();
}

// ─── Task WebSocket (real-time push) ────────────────────────────────────────
let taskWs = null;

function connectTaskWebSocket(id) {
  if (taskWs) { taskWs.close(); taskWs = null; }

  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  taskWs = new WebSocket(`${protocol}//${location.host}/ws/task/${id}`);

  taskWs.onmessage = (event) => {
    try {
      const state = JSON.parse(event.data);
      handleTaskStateUpdate(state);
    } catch (e) { /* ignore parse errors */ }
  };

  taskWs.onclose = () => { taskWs = null; };
  taskWs.onerror = () => { taskWs = null; };
}

function handleTaskStateUpdate(state) {
  // Update breathing indicator text from state.step
  if (state.step && state.step !== 'done') {
    const labels = { queued: '排队等待...', running: '处理中...', generating: '图片转 3D...', analyzing: '分析模型...', previewing: '渲染预览...', printing: '打印中...' };
    showBreathing(labels[state.step] || '处理中...');
  }

  // Show agent message in output area
  if (state.message) {
    const prev = $output.getAttribute('data-last-msg') || '';
    if (state.message !== prev) {
      addLine(state.message);
      $output.setAttribute('data-last-msg', state.message);
    }
  }

  // Handle completion
  if (state.status === 'done') {
    showDownload(state.download_url || '/api/download/' + taskId);
  } else if (state.status === 'failed') {
    hideBreathing();
    addLine('任务失败: ' + (state.message || '未知错误'));
    $btnPrint.disabled = false;
    $btnPrint.textContent = '开始打印';
    $hint.textContent = '任务失败，请重试';
    isPrinting = false;
  }
}

// ─── Gateway event handlers ───────────────────────────────────────────────
function onGatewayEvent(evt, payload) {
  switch (evt) {
    case 'chat.inject':
      if (payload.text) addLine(payload.text);
      break;
    case 'session.tool':
      if (payload.phase === 'start') {
        addLine('[ 执行: ' + (payload.name || 'tool') + ' ]', 'tool');
      }
      break;
    case 'session.error':
      addLine('Error: ' + (payload.message || ''), 'error');
      break;
  }
}

// ─── Selection ────────────────────────────────────────────────────────────
function selectCostume(id) {
  selectedCostume = COSTUMES.find(c => c.id === id);
  document.querySelectorAll('.ip-card').forEach(c => c.classList.remove('selected'));
  document.querySelector(`.ip-card[data-id="${id}"]`)?.classList.add('selected');
  $btnPrint.disabled = false;
  $hint.textContent = '已选择「' + selectedCostume.name + '」';
}

// ─── Print action ─────────────────────────────────────────────────────────
$btnPrint.addEventListener('click', async () => {
  if (!selectedCostume || !gateway?.connected || isPrinting) return;
  isPrinting = true;
  $btnPrint.disabled = true;
  $btnPrint.textContent = '处理中...';
  $hint.textContent = '正在发送...';
  $output.innerHTML = '';
  $output.removeAttribute('data-last-msg');
  $download.innerHTML = '';
  showBreathing('排队等待...');
  hideEmpty();

  try {
    const genRes = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ip_id: selectedCostume.id }),
    });
    const { task_id } = await genRes.json();
    taskId = task_id;

    // Connect WebSocket for real-time status push
    connectTaskWebSocket(taskId);

    const prompt = buildPrompt(selectedCostume, task_id);
    await gateway.sendMessage(prompt);
    $hint.textContent = 'OpenClaw 处理中...';
  } catch (e) {
    addLine('发送失败: ' + e.message);
    hideBreathing();
    isPrinting = false;
    $btnPrint.disabled = false;
    $btnPrint.textContent = '开始打印';
  }
});

// ─── Init ─────────────────────────────────────────────────────────────────
async function init() {
  renderIPCards();

  gateway = new GatewayChat();
  gateway.onEvent(onGatewayEvent);
  gateway.onEvent((evt) => {
    if (evt === 'connection') {
      const s = gateway.connected ? 'on' : 'off';
      $connDot.className = 'conn-dot' + (s === 'on' ? ' on' : '');
      $hint.textContent = gateway.connected ? '已连接 Gateway' : '未连接';
    }
  });

  try { await gateway.connect(); } catch (e) { $hint.textContent = '连接失败'; }
}

init();
</script>
</body>
</html>
