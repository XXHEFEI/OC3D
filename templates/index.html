<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开启 MetaX 造物之旅</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Microsoft YaHei', -apple-system, sans-serif;
            background: #050508;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            width: 95vw;
            height: 88vh;
            background: radial-gradient(circle at 30% 50%, #10101f 0%, #05050a 100%);
            border-radius: 24px;
            display: flex;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 40px rgba(0, 217, 255, 0.1);
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* ================= 左侧区域 ================= */
        .left {
            width: 55%;
            padding: 60px 70px;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
        }

        .title {
            font-size: 48px; /* 字体放大 */
            font-weight: bold;
            margin-bottom: 35px;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.4);
        }

        .card {
            background: linear-gradient(145deg, rgba(20, 20, 32, 0.8) 0%, rgba(10, 10, 18, 0.9) 100%);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 45px 50px; /* 增加内边距适应大字体 */
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid rgba(0, 217, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(0, 217, 255, 0.05);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .card-title {
            font-size: 36px; /* 字体放大 */
            font-weight: bold;
            color: #fff;
            letter-spacing: 1px;
        }

        .step-tag {
            background: linear-gradient(90deg, #00d9ff, #B562FF);
            color: #fff;
            padding: 8px 25px;
            border-radius: 30px;
            font-size: 22px; /* 字体放大 */
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 217, 255, 0.4);
        }

        .intro {
            font-size: 25px; /* 字体放大 */
            line-height: 1.8;
            margin-bottom: 35px;
            color: #ccc;
            letter-spacing: 1px;
        }
        
        /* 针对 曦曦 和 沐曦 的强调样式 */
        .text-xixi {
            color: #00d9ff;
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .text-muxi {
            color: #00d9ff;
            font-weight: bold;
            font-size: 1.3em;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0,217,255,0.6);
        }

        .text-highlight {
            color: #00d9ff;
            font-weight: bold;
        }

        /* ================= 路线介绍区块 ================= */
        .routes {
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin-bottom: 25px;
        }

        .route-item {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 25px 30px;
            border-radius: 16px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* 路线1：经典直印 */
        .route-1 { border-left: 4px solid #00d9ff; }
        .route-1:hover {
            transform: translateX(10px);
            background: rgba(0, 217, 255, 0.05);
            border-color: rgba(0, 217, 255, 0.3);
            box-shadow: -5px 0 20px rgba(0, 217, 255, 0.2);
        }
        .route-1 .route-icon { color: #00d9ff; border-color: #00d9ff; background: rgba(0, 217, 255, 0.1); }

        /* 路线2：DIY 胶囊 */
        .route-2 { border-left: 4px solid #ff416c; }
        .route-2:hover {
            transform: translateX(10px);
            background: rgba(255, 65, 108, 0.05);
            border-color: rgba(255, 65, 108, 0.3);
            box-shadow: -5px 0 20px rgba(255, 65, 108, 0.2);
        }
        .route-2 .route-icon { color: #ff416c; border-color: #ff416c; background: rgba(255, 65, 108, 0.1); }


        .route-icon {
            width: 65px;  /* 图标放大 */
            height: 65px;
            border: 2px solid;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 28px; /* 字体放大 */
            margin-right: 25px;
            flex-shrink: 0;
        }

        .route-content { flex: 1; }

        .route-title {
            font-size: 28px; /* 字体放大 */
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .route-desc {
            font-size: 20px;  /* 字体放大 */
            color: #aaa;
            line-height: 1.6;
        }

        /* ================= 开始按钮 ================= */
        .start-btn {
            background: linear-gradient(90deg, #B562FF, #0072FF);
            color: white;
            border: none;
            width: 90%; 
            max-width: 550px; 
            padding: 24px 0;
            border-radius: 40px;
            font-size: 32px; /* 字体放大 */
            font-weight: bold;
            cursor: pointer;
            align-self: center;
            margin-top: 30px;
            box-shadow: 0 6px 20px rgba(181, 98, 255, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            letter-spacing: 2px;
        }

        .start-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 30px rgba(181, 98, 255, 0.6);
        }

        /* ================= 右侧区域 ================= */
        .right {
            width: 45%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a14;
            border-left: 1px solid #1a1a2e;
        }

        .right::before {
            content: '';
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(0,217,255,0.15) 0%, transparent 60%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -40%);
            z-index: 1;
            pointer-events: none;
        }

        .logo {
            position: absolute;
            top: 40px;
            right: 40px;
            width: 220px;
            z-index: 10;
        }

        .cat {
            width: 75%;
            max-width: 450px;
            position: relative;
            z-index: 10;
            transform: translateY(-30px);
            filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.1));
        }

        .bubble-container {
            position: absolute;
            bottom: 11%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            animation: float-bubble 4s ease-in-out infinite;
        }

        .bubble {
            background: rgba(0, 240, 255, 0.05); 
            backdrop-filter: blur(8px);
            color: #00F0FF; 
            padding: 26px 45px;
            border: 2px solid #00F0FF; 
            border-radius: 35px;
            font-size: 30px; /* 字体放大 */
            font-weight: bold;
            position: relative;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3); 
            white-space: nowrap; 
            letter-spacing: 1px;
        }

        .bubble::after {
            content: '';
            position: absolute;
            top: -12px; 
            left: 50%;
            transform: translateX(-50%);
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 12px solid #00F0FF; 
        }

        @keyframes float-bubble {
            0% { transform: translateX(-50%) translateY(0px); }
            50% { transform: translateX(-50%) translateY(-10px); }
            100% { transform: translateX(-50%) translateY(0px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧区域 -->
        <div class="left">
            <h1 class="title">开启 MetaX 造物之旅</h1>
            <div class="card">
                <div class="card-header">
                    <div class="card-title">双线互动玩法</div>
                    <div class="step-tag">算力赋能创意</div>
                </div>
                
                <div class="intro">
                    你好呀！我是<span class="text-xixi">曦曦</span>，您的 3D 专属向导~<br>
                    <span class="text-muxi">沐曦</span> 依托强大的 <span class="text-highlight">GPU 与 AI 算力</span>，将创意瞬间转化为可触摸的 3D 实体！<br>
                    这里为您准备了<span class="text-highlight">两条专属路线</span>，满足你不同的造物渴望：
                </div>
                
                <div class="routes">
                    <!-- 路线 A：经典打印 -->
                    <div class="route-item route-1">
                        <div class="route-icon">A</div>
                        <div class="route-content">
                            <div class="route-title">经典速印 - 实体带走</div>
                            <div class="route-desc">挑选空间站最高人气的经典模型，预览 3D 细节后，立即下发指令 <span style="color:#00d9ff">现场 3D 打印并带走实物。</span></div>
                        </div>
                    </div>
                    
                    <!-- 路线 B：DIY 数字资产 -->
                    <div class="route-item route-2">
                        <div class="route-icon">B</div>
                        <div class="route-content">
                            <div class="route-title">魔法衣橱 - 专属 DIY</div>
                            <div class="route-desc">施展 AI 魔法自由换装，生成独一无二的 3D 模型，扫码 <span style="color:#ff416c">提取 3D 源文件数字胶囊。</span></div>
                        </div>
                    </div>
                </div>
                
                <!-- 注意：跳转链接保持跳转到双线分屏选择页 -->
                <button class="start-btn" onclick="location.href='select.html'">
                  立即接入空间站
                </button>
            </div>
        </div>

        <!-- 右侧区域 -->
        <div class="right">
            <img src="static/images/meta_logo.png" alt="MetaX Logo" class="logo" />
            
            <img src="static/images/cat.gif" alt="挥手的猫" class="cat">
            
            <div class="bubble-container">
                <div class="bubble">
                    经典手办 or 专属 DIY？由你决定！
                </div>
            </div>
        </div>
    </div>
</body>
</html>
